<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report a problem</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" type="image/svg+xml" href="/identity/favicon.svg">
  <link rel="stylesheet" href="/identity/brand-tokens.css">
  <link rel="stylesheet" href="/identity/brand-kit.css">
  <meta name="robots" content="noindex">
</head>
<body>
  <div class="login-card" style="max-width:560px;margin:0 auto" id="cmp-card">
    <h1 id="cmp-title">Report a problem</h1>
    <p class="muted" id="cmp-sub">Tell us what is wrong in your flat or building. We will look at it within a few days.</p>
    <div id="cmp-off" class="error" hidden>This form is not switched on yet. Please call or email us.</div>
    <form id="cmp-form" novalidate hidden>
      <div class="field"><label for="cmp-name">Your name</label><input id="cmp-name" autocomplete="name" maxlength="80"></div>
      <div class="field"><label for="cmp-phone">Mobile number</label><input id="cmp-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20"></div>
      <div class="field"><label for="cmp-flat">Flat number (for example A-402)</label><input id="cmp-flat" maxlength="20"></div>
      <div class="field"><label for="cmp-cat">What kind of problem</label><select id="cmp-cat"><option value="plumbing">Plumbing / water</option><option value="electrical">Electrical</option><option value="seepage">Seepage / leakage</option><option value="civil">Cracks / walls / tiles</option><option value="finishing">Doors, windows, paint</option><option value="other">Something else</option></select></div>
      <div class="field"><label for="cmp-title2">In a few words, what is wrong</label><input id="cmp-title2" maxlength="120"></div>
      <div class="field"><label for="cmp-detail">More details (optional)</label><textarea id="cmp-detail" rows="3" maxlength="500"></textarea></div>
      <div style="position:absolute;left:-9999px" aria-hidden="true"><label>Leave this empty<input id="cmp-trap" tabindex="-1" autocomplete="off"></label></div>
      <div class="field"><label class="check"><input type="checkbox" id="cmp-consent"> You may contact me about this by phone, WhatsApp or email.</label></div>
      <div id="cmp-turnstile" style="margin-bottom:12px"></div>
      <div class="error" id="cmp-error" hidden></div>
      <button class="btn btn-primary btn-full" type="submit" id="cmp-send">Send</button>
      <p class="help" id="cmp-mail"></p>
    </form>
    <div id="cmp-done" class="card" hidden><h2>Thank you</h2><p id="cmp-done-msg">We have your message.</p></div>
  </div>
  <script src="/complaint.js"></script>
</body>
</html>
