<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NirmaanCRM</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="/brand/theme.css">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="NirmaanCRM">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="guest">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="logo-mark" id="side-logo">N</div>
        <div class="trade-name" id="side-name">NirmaanCRM</div>
      </div>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div class="brand">
          <div class="logo-mark" id="top-logo">N</div>
          <div id="topbar-trade-name" class="trade-name">NirmaanCRM</div>
        </div>
        <div class="top-right">
          <button class="icon-btn" id="btn-search" title="Search" aria-label="Search"></button>
          <select id="project-picker" class="picker" aria-label="Project" hidden></select>
          <button class="icon-btn" id="btn-help" title="Help" aria-label="Help"></button>
          <button class="icon-btn" id="btn-bell" title="Notifications" aria-label="Notifications">
            <span id="bell-icon"></span><span id="notify-count" class="notify-badge">0</span>
          </button>
          <button class="icon-btn" id="btn-user-menu" title="Account" aria-label="Account"><span class="avatar" id="avatar">?</span></button>
          <div id="user-menu" class="user-menu">
            <div class="who"><b id="um-name"></b><span id="um-role"></span></div>
            <div class="menu-item" id="menu-profile">My profile</div>
            <div class="menu-item" id="menu-password">Change password</div>
            <div class="menu-item danger" id="menu-logout">Log out</div>
          </div>
        </div>
      </header>

      <main id="app-main" class="main"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="ui.js"></script>
  <script src="app.js"></script>
  <script src="install.js"></script>
  <script src="charts.js"></script>
  <script src="pages.js"></script>
  <script src="pages2.js"></script>
  <script src="pages3.js"></script>
  <script src="pages4.js"></script>
  <script src="pages5.js"></script>
  <script src="pages6.js"></script>
  <script src="pages7.js"></script>
  <script src="pages8.js"></script>
  <script src="pages9.js"></script>
  <script src="pages10.js"></script>
  <script src="pages11.js"></script>
  <script src="pages12.js"></script>
  <script src="pages13.js"></script>
  <script src="pages14.js"></script>
  <script src="pages15.js"></script>
  <script src="pages16.js"></script>
  <script src="pages17.js"></script>
  <script src="pages18.js"></script>
  <script src="pages19.js"></script>
  <script src="pages20.js"></script>
  <script src="pages21.js"></script>
</body>
</html>
