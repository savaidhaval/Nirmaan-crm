<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your visit</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" type="image/svg+xml" href="/identity/favicon.svg">
  <link rel="stylesheet" href="/identity/brand-tokens.css">
  <link rel="stylesheet" href="/identity/brand-kit.css">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <div class="login-card" style="max-width:520px;">
    <h1 id="c-title">Confirm your visit</h1>
    <div id="c-form" hidden>
      <p id="c-ask" style="font-size:18px"></p>
      <label>Your mobile number<input id="c-phone" type="tel" inputmode="numeric" autocomplete="tel" style="width:100%;min-height:52px;font-size:18px;padding:0 14px;border-radius:14px;border:1px solid #d1d5db;margin:6px 0 14px"></label>
      <button class="btn btn-primary btn-full" id="c-yes" style="min-height:56px;font-size:18px"></button>
      <button class="btn btn-full" id="c-no" style="min-height:56px;font-size:18px;margin-top:10px">No, I came on my own</button>
    </div>
    <p id="c-msg" style="font-size:18px"></p>
  </div>
  <script src="c.js"></script>
</body>
</html>
