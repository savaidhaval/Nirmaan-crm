<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NirmaanCRM — Sign In</title>
  <link rel="stylesheet" href="app.css">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <img src="/brand/logo.png" alt="Company logo" class="logo" onerror="this.style.display='none'">
      <div class="trade-name">NirmaanCRM</div>
    </div>

    <h1>Sign In</h1>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@yourcompany.in" autocomplete="email">
    </div>

    <div class="field">
      <label>Password</label>
      <div class="password-input">
        <input type="password" id="password" placeholder="••••••••••" autocomplete="current-password">
        <button type="button" id="toggle-password">Show</button>
      </div>
    </div>

    <div class="error" id="error" style="display:none;"></div>

    <button class="btn btn-primary" id="btn-login">Sign In</button>

    <p style="text-align:center;margin-top:16px"><button type="button" class="btn small" data-install>Install the app on this device</button></p>
    <p class="help">
      First time? Your temporary password was shown to you once when you were added.<br>
      At first login you must choose your own password (10+ characters).
    </p>
  </div>

  <script src="install.js"></script>
  <script src="ui.js"></script>
  <script src="login.js"></script>
</body>
</html>
