# Deploys to Cloudflare whenever main changes: applies new D1 migrations, then publishes the Worker.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Workers Routes/Zone:Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy
on:
  push:
    branches: [main]
concurrency: deploy-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nirmaan-db --remote
      # Cloudflare's free AI binding makes local runs and tests try to connect to Cloudflare, so it is added here, at deploy time only.
      - name: Add the AI binding for this deploy
        run: printf '\n[ai]\nbinding = "AI"\n' >> wrangler.toml
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env=""
