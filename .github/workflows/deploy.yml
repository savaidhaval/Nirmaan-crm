# Deploys to Cloudflare whenever main changes, only after CI passes (and, if configured, a reviewer approves the 'production' environment):
# applies new D1 migrations, then publishes the Worker.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Workers Routes/Zone:Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy
on:
  push:
    branches: [main]
concurrency: deploy-production
jobs:
  # Gate: the full CI (syntax, prod + staging bundle dry-runs, all migrations on an empty local D1, every test suite) must pass first.
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # Add required reviewers to the 'production' environment in GitHub (Settings -> Environments) to make every deploy wait for approval.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply nirmaan-db --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env=""
