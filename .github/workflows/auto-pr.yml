# Opens a pull request automatically whenever a claude/* branch is pushed (if none is open yet).
# Needs: repo Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
name: Auto pull request
on:
  push:
    branches: ['claude/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          existing=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=open" --jq 'length')
          if [ "$existing" = "0" ]; then
            gh api -X POST "repos/$REPO/pulls" -f title="$BRANCH" -f head="$BRANCH" -f base="$BASE" \
              -f body="Opened automatically for branch \`$BRANCH\`. See the commits for details."
          fi
